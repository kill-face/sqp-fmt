[package]
name = "sqp-fmt"
version = "0.1.0"
edition = "2024"
description = "SQL formatter for the dialects sqlparser-rs parses; changes only whitespace and keyword case"
license = "MIT"

[dependencies]
# sqp-rs: fork of apache/datafusion-sqlparser-rs with grammar and span fixes.
# Path dependency while both are developed side by side; switch to the git
# fork (kill-face/sqp-rs, branch main) for Nix builds.
sqlparser = { path = "../sqp-rs", features = ["visitor"] }
# The configuration file (sqp-fmt.toml).
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[profile.release]
lto = true
codegen-units = 1
